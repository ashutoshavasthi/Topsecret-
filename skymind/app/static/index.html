<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyMind Control</title>
<style>
  :root {
    --bg: #070b10; --panel: #0d141c; --panel2: #111b26; --line: #1d2b3a;
    --text: #d7e3ee; --dim: #7f93a6; --accent: #35d7ff; --accent2: #7cffb2;
    --warn: #ffcc4d; --danger: #ff4d5e; --radius: 14px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0b121a, var(--bg)); flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .18em; font-size: 15px; }
  .core { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent);
    box-shadow: 0 0 12px var(--accent), inset 0 0 8px var(--accent); position: relative; }
  .core.busy { animation: pulse 1s ease-in-out infinite; }
  .core.listening { border-color: var(--accent2); box-shadow: 0 0 16px var(--accent2), inset 0 0 10px var(--accent2); }
  @keyframes pulse { 50% { transform: scale(1.18); opacity: .7; } }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip { font: 12px var(--mono); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--dim); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.ok b { color: var(--accent2); } .chip.warn b { color: var(--warn); } .chip.bad b { color: var(--danger); }
  main { flex: 1; display: grid; gap: 14px; padding: 14px 16px 16px; min-height: 0;
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "video map" "video chat" "controls chat" "tele chat"; }
  @media (min-width: 861px) { body { height: 100vh; overflow: hidden; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card h2 { margin: 0; padding: 9px 12px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--dim);
    border-bottom: 1px solid var(--line); text-transform: uppercase; display: flex; justify-content: space-between; }
  #videoCard { grid-area: video; position: relative; }
  .video { position: relative; aspect-ratio: 4/3; background: #000; max-height: 56vh; margin: 0 auto; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: auto; }
  .hud { position: absolute; inset: 10px; pointer-events: none; }
  .hud i { position: absolute; width: 26px; height: 26px; border: 2px solid var(--accent); opacity: .75; }
  .hud i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .hud i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .hud i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .hud i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .reticle { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border: 1px solid rgba(53,215,255,.55); border-radius: 50%; }
  .reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px;
    background: var(--accent); border-radius: 50%; }
  .novideo { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font: 13px var(--mono); }
  #controls { grid-area: controls; display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  button { font: 600 14px system-ui, sans-serif; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--accent); color: #fff; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .stop { background: var(--danger); border-color: var(--danger); color: #fff; font-size: 17px; letter-spacing: .12em;
    padding: 12px 26px; margin-left: auto; box-shadow: 0 0 18px rgba(255,77,94,.35); }
  .stop:hover { background: #ff6170; color: #fff; border-color: #ff6170; }
  #mapCard { grid-area: map; align-self: start; } #teleCard { grid-area: tele; align-self: start; }
  #mapImg { width: 100%; max-height: 34vh; object-fit: contain; display: block; background: #121010; }
  .tele { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
  .tele div { background: var(--panel); padding: 9px 12px; }
  .tele span { display: block; font: 11px var(--mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  .tele b { font: 600 18px var(--mono); }
  .bar { height: 6px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent2); width: 0; transition: width .4s; }
  #chatCard { grid-area: chat; display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #16324a; border: 1px solid #1f4767; }
  .msg.assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); }
  .msg.assistant::before { content: attr(data-name); display: block; font: 600 10px var(--mono);
    color: var(--accent); letter-spacing: .14em; margin-bottom: 2px; }
  .msg.system { align-self: center; max-width: 95%; color: var(--dim); font: 12px var(--mono); padding: 2px 6px; }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .compose input[type=text] { flex: 1; min-width: 180px; background: var(--bg); color: var(--text); font: 15px system-ui;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  .compose input[type=text]:focus { border-color: var(--accent); }
  .mic { width: 52px; padding: 0; font-size: 20px; }
  .mic.on { background: var(--accent2); color: #04110a; border-color: var(--accent2); animation: pulse 1s infinite; }
  .toggles { display: flex; gap: 14px; align-items: center; padding: 0 10px 10px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
  .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .hint { color: var(--dim); font-size: 12px; padding: 0 12px 10px; }
  .banner { display: none; background: #2a1c06; color: var(--warn); border: 1px solid #5a3d0c; border-radius: 10px;
    padding: 8px 12px; margin: 0 16px; font-size: 13px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "video" "controls" "chat" "map" "tele"; padding: 10px; }
    #log { max-height: 50vh; }
    .tele { grid-template-columns: 1fr 1fr; }
    .stop { margin-left: 0; flex: 1 0 100%; order: -1; }
    #controls button:not(.stop) { flex: 1 1 28%; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="core" id="core"></div><span id="brand">SKYMIND</span></div>
  <div class="chips">
    <span class="chip" id="chipMode">MODE <b>—</b></span>
    <span class="chip" id="chipBat">BAT <b>—</b></span>
    <span class="chip" id="chipLink">LINK <b>—</b></span>
    <span class="chip" id="chipAI">AI <b>—</b></span>
    <span class="chip" id="chipSim">DRONE <b>—</b></span>
  </div>
</header>
<div class="banner" id="banner"></div>
<main>
  <section class="card" id="videoCard">
    <h2><span>Onboard camera</span><span id="dets"></span></h2>
    <div class="video">
      <img id="video" alt="Live drone camera">
      <div class="novideo" id="novideo">waiting for camera…</div>
      <div class="hud"><i></i><i></i><i></i><i></i><div class="reticle"></div></div>
    </div>
  </section>

  <div id="controls">
    <button data-tool="takeoff">⬆ Take off</button>
    <button data-tool="land">⬇ Land</button>
    <button data-tool="return_home">⌂ Home</button>
    <button data-tool="scan">⟳ Look around</button>
    <button data-tool="photo">◉ Photo</button>
    <button id="resetBtn" style="display:none">↺ Reset sim</button>
    <button class="stop" id="stopBtn" title="Esc">■ STOP</button>
  </div>

  <section class="card" id="mapCard">
      <h2><span>Live map</span><span>what the drone has mapped</span></h2>
      <img id="mapImg" alt="Live map">
  </section>
  <section class="card" id="teleCard">
      <h2><span>Telemetry</span><span id="tClock"></span></h2>
      <div class="tele">
        <div><span>Altitude</span><b id="tAlt">—</b></div>
        <div><span>Speed</span><b id="tSpd">—</b></div>
        <div><span>Heading</span><b id="tHdg">—</b></div>
        <div><span>Nearest obstacle</span><b id="tObs">—</b></div>
        <div><span>Power</span><b id="tPwr">—</b></div>
        <div><span>Battery</span><b id="tBat">—</b><div class="bar"><i id="batBar"></i></div></div>
      </div>
  </section>

  <section class="card" id="chatCard">
    <h2><span>Assistant</span><span id="aiState">idle</span></h2>
    <div id="log" aria-live="polite"></div>
    <form class="compose" id="form" autocomplete="off">
      <button type="button" class="mic" id="mic" title="Push to talk (Space)">🎙</button>
      <input type="text" id="input" placeholder="Try: “take off and go to the door”, “what do you see?”, “come back”">
      <button type="submit">Send</button>
    </form>
    <div class="toggles">
      <label><input type="checkbox" id="speak" checked> Speak replies</label>
      <label><input type="checkbox" id="handsfree"> Hands-free (say “<span id="wake">skymind</span> …”)</label>
    </div>
    <div class="hint" id="places"></div>
  </section>
</main>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("t");
  const withT = (p) => token ? p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token) : p;
  const $ = (id) => document.getElementById(id);
  const post = (path, body) => fetch(withT(path), { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify(body || {}) });
  let name = "SkyMind", lastMsg = 0, online = false, busy = false;

  // ---------------------------------------------------------------- video & map
  const video = $("video");
  video.onload = () => { $("novideo").style.display = "none"; };
  video.onerror = () => { $("novideo").style.display = "grid"; setTimeout(() => video.src = withT("/video.mjpg?" + Date.now()), 1500); };
  video.src = withT("/video.mjpg");
  const map = new Image();
  map.onload = () => { $("mapImg").src = map.src; setTimeout(loadMap, 600); };
  map.onerror = () => setTimeout(loadMap, 1500);
  const loadMap = () => { map.src = withT("/map.png?" + Date.now()); };
  loadMap();

  // ---------------------------------------------------------------- status
  const MODE = { preflight: "READY", takeoff: "TAKEOFF", mission: "FLYING", hold: "HOVER", rtl: "RETURNING",
                 land: "LANDING", landed: "LANDED", crashed: "CRASHED" };
  function chip(id, label, value, cls) {
    const el = $(id); el.className = "chip " + (cls || ""); el.innerHTML = label + " <b>" + value + "</b>";
  }
  async function pollStatus() {
    try {
      const r = await fetch(withT("/api/status")); const s = await r.json(); online = true;
      const a = s.assistant || {};
      name = a.name || name; $("brand").textContent = name.toUpperCase(); $("wake").textContent = (a.wake_word || "skymind");
      busy = !!a.busy; $("core").classList.toggle("busy", busy); $("aiState").textContent = busy ? "working…" : "idle";
      const m = s.mode || "—";
      chip("chipMode", "MODE", MODE[m] || m.toUpperCase(), m === "crashed" ? "bad" : (m === "hold" || m === "mission") ? "ok" : "");
      const bat = Math.round((s.battery || 0) * 100);
      chip("chipBat", "BAT", bat + "%", bat < 30 ? "bad" : bat < 50 ? "warn" : "ok");
      chip("chipLink", "LINK", s.error ? "ERROR" : "OK", s.error ? "bad" : "ok");
      chip("chipAI", "AI", a.llm ? a.llm + (a.vision ? " + " + a.vision : "") : "built-in", a.llm ? "ok" : "warn");
      chip("chipSim", "DRONE", s.simulated ? "SIMULATED" : (s.armed_allowed ? "REAL · ARMED" : "REAL · BENCH"), s.simulated ? "" : "warn");
      const p = s.position || [0, 0, 0];
      $("tAlt").textContent = p[2].toFixed(2) + " m"; $("tSpd").textContent = (s.speed || 0).toFixed(2) + " m/s";
      $("tHdg").textContent = Math.round(((90 - (s.yaw_deg || 0)) % 360 + 360) % 360) + "°";
      $("tObs").textContent = s.min_range == null ? "—" : s.min_range.toFixed(2) + " m";
      $("tObs").style.color = s.min_range != null && s.min_range < 0.5 ? "var(--warn)" : "";
      $("tPwr").textContent = (s.power_w || 0).toFixed(0) + " W"; $("tBat").textContent = bat + "%";
      $("batBar").style.width = bat + "%"; $("batBar").style.background = bat < 30 ? "var(--danger)" : "var(--accent2)";
      $("tClock").textContent = "t " + (s.t || 0).toFixed(0) + " s";
      const d = s.detections || [];
      $("dets").textContent = d.length ? "sees: " + [...new Set(d.map(x => x.label.replace(/_/g, " ")))].join(", ") : "";
      $("places").textContent = s.places && s.places.length ? "Places I know: " + s.places.join(", ") : "";
      $("resetBtn").style.display = s.can_reset ? "" : "none";
    } catch (e) { online = false; chip("chipLink", "LINK", "OFFLINE", "bad"); }
    setTimeout(pollStatus, 300);
  }
  pollStatus();

  // ---------------------------------------------------------------- chat
  const log = $("log");
  function addMsg(m) {
    const el = document.createElement("div");
    el.className = "msg " + m.role; el.textContent = m.text;
    if (m.role === "assistant") el.dataset.name = name.toUpperCase();
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    if (m.speak && $("speak").checked && "speechSynthesis" in window && m.id > bootId) say(m.text);
  }
  let bootId = Infinity;
  async function pollMessages() {
    try {
      const r = await fetch(withT("/api/messages?after=" + lastMsg)); const list = await r.json();
      if (bootId === Infinity) bootId = list.length ? list[list.length - 1].id : 0;  // don't read old history aloud
      for (const m of list) { addMsg(m); lastMsg = Math.max(lastMsg, m.id); }
    } catch (e) {}
    setTimeout(pollMessages, 350);
  }
  pollMessages();
  function send(text) {
    text = (text || "").trim(); if (!text) return;
    post("/api/chat", { text });
  }
  $("form").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value); $("input").value = ""; });
  document.querySelectorAll("[data-tool]").forEach(b => b.addEventListener("click", () => post("/api/tool", { tool: b.dataset.tool })));
  const stopNow = () => { post("/api/stop"); if ("speechSynthesis" in window) speechSynthesis.cancel(); };
  $("stopBtn").addEventListener("click", stopNow);
  $("resetBtn").addEventListener("click", () => post("/api/reset"));

  // ---------------------------------------------------------------- voice out
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en-GB/i.test(v.lang) && /male|daniel|george|arthur/i.test(v.name)) ||
            vs.find(v => /en-(GB|IN)/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    const u = new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g, ""));
    if (voice) u.voice = voice; u.rate = 1.03; u.pitch = 0.95;
    speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- voice in
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const banner = $("banner");
  if (!SR) {
    $("mic").disabled = true; $("handsfree").disabled = true;
    banner.style.display = "block";
    banner.textContent = "Voice input needs Chrome or Edge. You can still type commands.";
  } else if (!window.isSecureContext) {
    $("mic").disabled = true; $("handsfree").disabled = true;
    banner.style.display = "block";
    banner.textContent = "Voice input only works on localhost or HTTPS. Open the app on the laptop itself (http://localhost…) to talk to it; typing works here.";
  }
  let rec = null, listening = false;
  function setListening(on) { listening = on; $("mic").classList.toggle("on", on); $("core").classList.toggle("listening", on); }
  function pushToTalk() {
    if (!SR || listening) return;
    rec = new SR(); rec.lang = "en-IN"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => send(e.results[0][0].transcript);
    rec.onend = () => { setListening(false); if ($("handsfree").checked) startHandsFree(); };
    rec.onerror = () => setListening(false);
    if (hf) { hf.onend = null; hf.stop(); hf = null; }
    setListening(true); rec.start();
  }
  $("mic").addEventListener("click", pushToTalk);
  // Hands-free: listen continuously; act on phrases that start with the wake word.
  // "stop" is always obeyed, wake word or not.
  let hf = null;
  function startHandsFree() {
    if (!SR || hf) return;
    hf = new SR(); hf.lang = "en-IN"; hf.continuous = true; hf.interimResults = false;
    hf.onresult = (e) => {
      const text = e.results[e.results.length - 1][0].transcript.trim();
      const low = text.toLowerCase(), wake = ($("wake").textContent || "skymind").toLowerCase();
      if (/\b(stop|abort|halt)\b/.test(low)) return stopNow();
      const i = low.indexOf(wake);
      if (i >= 0) { const cmd = text.slice(i + wake.length).replace(/^[\s,.!]+/, ""); send(cmd || "status"); }
    };
    hf.onend = () => { hf = null; if ($("handsfree").checked) setTimeout(startHandsFree, 300); };
    hf.start();
  }
  $("handsfree").addEventListener("change", (e) => { if (e.target.checked) startHandsFree(); else if (hf) { hf.onend = null; hf.stop(); hf = null; } });

  // ---------------------------------------------------------------- keys
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); stopNow(); }
    if (e.code === "Space" && document.activeElement !== $("input")) { e.preventDefault(); pushToTalk(); }
  });
})();
</script>
</body>
</html>
