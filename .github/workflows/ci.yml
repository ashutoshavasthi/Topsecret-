name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fly the demo mission and judge it
        run: python -m skymind sim --config config/default.yaml --out runs/ci-demo
      - name: Fly the micro drone indoor mission
        run: python -m skymind sim --config config/micro_indoor.yaml --out runs/ci-micro
      - name: Fly the Nano (Rs 5,000) drone over a simulated lossy WiFi link
        run: python -m skymind sim --config config/nano_room.yaml --out runs/ci-nano
      - run: python -m skymind design config/nano.yaml config/micro_quiet.yaml config/default.yaml
      - name: Scan a room (autonomous exploration)
        run: python -m skymind survey --out runs/ci-survey
      - name: Throw balls at it
        run: python -m skymind dodge --sensors none,tof8x8+looming_wide --speeds 3,5 --throws 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-flights
          path: runs/
