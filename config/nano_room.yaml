# Nano drone in a hostel room / small lab (8 m x 5 m) with a 1 m doorway into a corridor.
base: nano.yaml

mission:
  home: [0.6, 0.0]
  cruise_altitude: 0.9
  waypoints:
    - [3.2, 1.4]
    - [6.8, 1.6]
    - [6.8, -1.6]
  geofence: [0.0, -2.5, 8.0, 2.5]
  max_altitude: 1.8
  max_duration: 180.0
  blocked_timeout: 6.0
  places:                            # names you can say: "go to the door"
    home: [0.6, 0.0]
    door: [4.0, 0.7]                 # just before the doorway
    corridor: [5.6, 0.7]             # just through it
    table: [1.9, 1.4]
    cupboard: [6.8, 0.0]
    window: [7.0, 1.8]

world:
  cylinders:                         # [x, y, radius, height]
    - [2.0, -0.6, 0.25, 1.0]         # chair
    - [3.0, -1.6, 0.25, 1.0]         # chair
    - [6.0, 0.2, 0.2, 2.5]           # floor lamp / pillar
  boxes:                             # [xmin, ymin, xmax, ymax, height]
    - [4.6, -2.5, 4.75, 0.2, 2.5]    # partition wall, south part
    - [4.6, 1.2, 4.75, 2.5, 2.5]     # partition wall, north part (1.0 m doorway y 0.2..1.2)
    - [1.2, 1.6, 2.6, 2.5, 0.75]     # table (fly over at 0.9 m)
    - [7.3, -0.6, 8.0, 0.6, 1.8]     # cupboard
  targets:                           # [x, y, z, radius, label]
    - [4.55, 2.0, 1.0, 0.07, red_marker]
    - [7.95, 1.8, 0.9, 0.07, yellow_marker]
    - [7.95, -1.8, 1.1, 0.07, red_marker]
  gust_std: 0.05                     # ceiling fan off, please
