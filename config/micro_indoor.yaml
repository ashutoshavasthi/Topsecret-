# Micro Quiet drone, indoor college-lab course: two rooms joined by a 1.4 m doorway,
# pillars, tall shelves, low desks (flown over), survey markers on the walls.
base: micro_quiet.yaml

mission:
  home: [1.0, 0.0]
  cruise_altitude: 1.3
  cruise_speed: 1.5
  waypoints:
    - [9.0, 3.0]
    - [17.0, 2.5]
    - [17.0, -3.0]
  geofence: [-1.0, -5.0, 20.0, 5.0]   # the room walls
  max_altitude: 2.4                    # ceiling: never climb into it
  max_duration: 150.0
  blocked_timeout: 6.0
  places:
    home: [1.0, 0.0]
    doorway: [10.0, 0.5]
    lab: [16.0, 0.5]
    desk: [3.5, -1.5]
    shelf: [8.5, -2.5]
    cabinet: [17.5, 0.5]

world:
  cylinders:                 # [x, y, radius, height]
    - [4.0, 0.3, 0.25, 3.0]  # pillars
    - [6.5, 2.2, 0.25, 3.0]
    - [14.0, 0.5, 0.25, 3.0]
    - [15.5, -1.8, 0.2, 3.0] # lamp stand
  boxes:                     # [xmin, ymin, xmax, ymax, height]
    - [11.0, -5.0, 11.3, -0.2, 3.0]   # dividing wall, south part
    - [11.0, 1.2, 11.3, 5.0, 3.0]     # dividing wall, north part (doorway y -0.2..1.2)
    - [7.5, -4.0, 9.5, -3.4, 2.0]     # shelf
    - [2.5, -3.0, 4.5, -2.2, 0.75]    # desk (below flight altitude)
    - [13.0, 2.6, 15.0, 3.4, 0.75]    # desk
    - [18.2, -0.5, 19.5, 1.5, 2.0]    # cabinet
  targets:                   # [x, y, z, radius, label]
    - [10.9, 3.5, 1.4, 0.12, red_marker]
    - [19.9, 3.0, 1.2, 0.12, yellow_marker]
    - [19.9, -3.5, 1.5, 0.12, red_marker]
    - [3.5, -2.6, 0.85, 0.1, yellow_marker]   # on the desk
  wind: [0.0, 0.0, 0.0]      # indoors: just a little air from vents
  gust_std: 0.15
