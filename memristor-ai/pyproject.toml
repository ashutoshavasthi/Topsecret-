[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membrain"
version = "0.1.0"
description = "Neural networks that compute and learn inside simulated memristor crossbar arrays"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
membrain = "membrain.cli:main"

[tool.setuptools.packages.find]
include = ["membrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
